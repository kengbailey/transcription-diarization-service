<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Evaluation</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242833;
    --border: #2e3345;
    --text: #e4e6ef;
    --text2: #8b8fa3;
    --accent: #6c72ff;
    --accent2: #4a4fbf;
    --green: #4caf50;
    --orange: #ff9800;
    --red: #ef5350;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5em; margin-bottom: 4px; }
  .subtitle { color: var(--text2); margin-bottom: 24px; font-size: 0.9em; }
  .stats {
    display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    min-width: 120px;
  }
  .stat-value { font-size: 1.8em; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.8em; color: var(--text2); margin-top: 2px; }

  .toolbar {
    display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.9em;
    width: 200px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: 500;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent2); }
  button.secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--border); }
  button.danger { background: var(--red); }
  button.success { background: var(--green); }
  button:disabled { opacity: 0.4; cursor: default; }

  .clusters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .cluster-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color 0.15s;
  }
  .cluster-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .cluster-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cluster-name {
    font-weight: 600;
    font-size: 1em;
  }
  .cluster-name.unnamed { color: var(--text2); font-style: italic; }
  .cluster-badge {
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.75em;
    color: var(--text2);
  }
  .member {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .member-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 0.82em;
  }
  .member-meeting { color: var(--text2); }
  .member-speaker { font-weight: 500; }
  .member-time { color: var(--text2); font-size: 0.8em; }
  .member-clips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .clip-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.78em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .clip-btn:hover { border-color: var(--accent); }
  .clip-btn.playing { border-color: var(--green); color: var(--green); }

  .name-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.85em;
    width: 140px;
  }

  .select-checkbox {
    width: 18px; height: 18px; cursor: pointer;
    accent-color: var(--accent);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty-state h2 { font-size: 1.2em; margin-bottom: 8px; color: var(--text); }

  audio { display: none; }
  
  .filter-bar {
    display: flex; gap: 10px; margin-bottom: 16px; align-items: center;
  }
  .filter-bar label { font-size: 0.85em; color: var(--text2); }
  .filter-bar select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<h1>🎙️ Speaker Evaluation</h1>
<p class="subtitle">Listen to clips, identify speakers, and merge duplicates across meetings</p>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="text" id="mergeName" placeholder="Speaker name..." />
  <button id="mergeBtn" class="success" disabled onclick="mergeSelected()">Merge Selected</button>
  <button class="secondary" onclick="selectNone()">Clear Selection</button>
  <span style="flex:1"></span>
  <button class="secondary" onclick="loadData()">↻ Refresh</button>
</div>

<div class="filter-bar">
  <label>Sort by:</label>
  <select id="sortBy" onchange="renderClusters()">
    <option value="members">Most Members</option>
    <option value="time">Most Speaking Time</option>
    <option value="name">Named First</option>
    <option value="unnamed">Unnamed First</option>
  </select>
  <label>Filter:</label>
  <select id="filterBy" onchange="renderClusters()">
    <option value="all">All</option>
    <option value="unnamed">Unnamed Only</option>
    <option value="named">Named Only</option>
    <option value="multi">Multi-member</option>
  </select>
</div>

<div class="clusters-grid" id="clustersGrid"></div>

<audio id="audioPlayer"></audio>

<script>
let manifest = null;
let selectedClusters = new Set();
let currentlyPlaying = null;
const audioPlayer = document.getElementById('audioPlayer');

async function loadData() {
  const res = await fetch('/api/manifest');
  manifest = await res.json();
  renderStats();
  renderClusters();
}

function renderStats() {
  const meetings = Object.keys(manifest.meetings || {}).length;
  const clusters = (manifest.clusters || []).length;
  const named = (manifest.clusters || []).filter(c => c.name).length;
  const totalMembers = (manifest.clusters || []).reduce((s, c) => s + (c.members || []).length, 0);
  
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${meetings}</div><div class="stat-label">Meetings</div></div>
    <div class="stat"><div class="stat-value">${clusters}</div><div class="stat-label">Speaker Clusters</div></div>
    <div class="stat"><div class="stat-value">${named}</div><div class="stat-label">Named</div></div>
    <div class="stat"><div class="stat-value">${clusters - named}</div><div class="stat-label">Unnamed</div></div>
    <div class="stat"><div class="stat-value">${totalMembers}</div><div class="stat-label">Total Instances</div></div>
  `;
}

function renderClusters() {
  const grid = document.getElementById('clustersGrid');
  let clusters = [...(manifest.clusters || [])];
  
  // Filter
  const filter = document.getElementById('filterBy').value;
  if (filter === 'unnamed') clusters = clusters.filter(c => !c.name);
  else if (filter === 'named') clusters = clusters.filter(c => c.name);
  else if (filter === 'multi') clusters = clusters.filter(c => (c.members || []).length > 1);
  
  // Sort
  const sort = document.getElementById('sortBy').value;
  if (sort === 'members') clusters.sort((a, b) => (b.members || []).length - (a.members || []).length);
  else if (sort === 'time') clusters.sort((a, b) => totalTime(b) - totalTime(a));
  else if (sort === 'name') clusters.sort((a, b) => (b.name ? 1 : 0) - (a.name ? 1 : 0));
  else if (sort === 'unnamed') clusters.sort((a, b) => (a.name ? 1 : 0) - (b.name ? 1 : 0));
  
  if (!clusters.length) {
    grid.innerHTML = `<div class="empty-state"><h2>No clusters yet</h2><p>Process some meetings first</p></div>`;
    return;
  }
  
  grid.innerHTML = clusters.map(c => renderCluster(c)).join('');
}

function totalTime(cluster) {
  return (cluster.members || []).reduce((s, m) => s + (m.total_time || 0), 0);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m > 0 ? `${m}m${s}s` : `${s}s`;
}

function renderCluster(cluster) {
  const isSelected = selectedClusters.has(cluster.id);
  const members = cluster.members || [];
  const tt = totalTime(cluster);
  
  return `
    <div class="cluster-card ${isSelected ? 'selected' : ''}" data-id="${cluster.id}">
      <div class="cluster-header">
        <div style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" class="select-checkbox" 
            ${isSelected ? 'checked' : ''} 
            onchange="toggleSelect(${cluster.id})">
          ${cluster.name 
            ? `<span class="cluster-name">${cluster.name}</span>
               <button class="secondary" style="padding:2px 8px;font-size:0.75em" onclick="renameCluster(${cluster.id})">✏️</button>` 
            : `<input class="name-input" id="name-${cluster.id}" placeholder="Name this speaker..." 
                onkeydown="if(event.key==='Enter')nameCluster(${cluster.id},this.value)">
               <button class="success" style="padding:4px 10px;font-size:0.78em" 
                onclick="nameCluster(${cluster.id}, document.getElementById('name-${cluster.id}').value)">Save</button>`
          }
        </div>
        <div>
          <span class="cluster-badge">${members.length} clip${members.length !== 1 ? 's' : ''}</span>
          <span class="cluster-badge">${formatTime(tt)}</span>
        </div>
      </div>
      ${members.map((m, i) => renderMember(m, i, cluster.id)).join('')}
    </div>
  `;
}

function renderMember(member, index, clusterId) {
  const clips = member.clips || [];
  const meetingId = member.meeting_id || member.meeting_file || '?';
  
  return `
    <div class="member">
      <div class="member-info">
        <span class="member-speaker">${member.speaker_label}</span>
        <span class="member-meeting">${meetingId}</span>
        <span class="member-time">${formatTime(member.total_time || 0)}</span>
      </div>
      <div class="member-clips">
        ${clips.map((clip, ci) => `
          <button class="clip-btn" id="clip-${clip.file}" onclick="playClip('${clip.file}', this)">
            ▶ ${formatTime(clip.duration)}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function playClip(clipFile, btn) {
  // Stop current
  if (currentlyPlaying) {
    currentlyPlaying.classList.remove('playing');
  }
  
  if (audioPlayer.src.endsWith(clipFile) && !audioPlayer.paused) {
    audioPlayer.pause();
    currentlyPlaying = null;
    return;
  }
  
  audioPlayer.src = `/api/clips/${clipFile}`;
  audioPlayer.play();
  btn.classList.add('playing');
  btn.textContent = '⏸ ' + btn.textContent.slice(2);
  currentlyPlaying = btn;
  
  audioPlayer.onended = () => {
    btn.classList.remove('playing');
    btn.textContent = '▶' + btn.textContent.slice(1);
    currentlyPlaying = null;
  };
}

function toggleSelect(id) {
  if (selectedClusters.has(id)) {
    selectedClusters.delete(id);
  } else {
    selectedClusters.add(id);
  }
  updateMergeBtn();
  renderClusters();
}

function selectNone() {
  selectedClusters.clear();
  updateMergeBtn();
  renderClusters();
}

function updateMergeBtn() {
  const btn = document.getElementById('mergeBtn');
  btn.disabled = selectedClusters.size < 2;
  btn.textContent = selectedClusters.size >= 2 
    ? `Merge ${selectedClusters.size} Selected` 
    : 'Merge Selected';
}

async function mergeSelected() {
  const name = document.getElementById('mergeName').value.trim();
  if (!name) { alert('Enter a name for the merged speaker'); return; }
  
  const res = await fetch('/api/clusters/merge', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      cluster_ids: [...selectedClusters],
      name: name
    })
  });
  
  if (res.ok) {
    selectedClusters.clear();
    document.getElementById('mergeName').value = '';
    updateMergeBtn();
    await loadData();
  }
}

async function nameCluster(id, name) {
  if (!name || !name.trim()) { alert('Enter a name first'); return; }
  
  const res = await fetch(`/api/clusters/${id}/name`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name: name.trim() })
  });
  
  if (res.ok) {
    showToast(`Saved: ${name.trim()}`);
    await loadData();
  } else {
    alert('Failed to save name');
  }
}

async function renameCluster(id) {
  const cluster = (manifest.clusters || []).find(c => c.id === id);
  const newName = prompt('Rename speaker:', cluster?.name || '');
  if (newName !== null && newName.trim()) {
    await nameCluster(id, newName.trim());
  }
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#4caf50;color:white;padding:12px 24px;border-radius:8px;font-size:0.9em;z-index:999;animation:fadeIn 0.2s';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// Init
loadData();
</script>
</body>
</html>
