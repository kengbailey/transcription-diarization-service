<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Review</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --text2: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --orange: #d29922; --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  
  .app { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.5em; margin-bottom: 4px; }
  .subtitle { color: var(--text2); font-size: 0.9em; margin-bottom: 20px; }
  
  /* Meeting List */
  .meeting-list { display: flex; flex-direction: column; gap: 8px; }
  .meeting-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 18px; cursor: pointer; transition: border-color 0.2s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .meeting-card:hover { border-color: var(--accent); }
  .meeting-info { display: flex; flex-direction: column; gap: 4px; }
  .meeting-file { font-size: 0.85em; color: var(--text2); font-family: monospace; }
  .meeting-meta { display: flex; gap: 12px; font-size: 0.8em; color: var(--text2); }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
  .badge-green { background: #1a3a2a; color: var(--green); }
  .badge-orange { background: #2a2a1a; color: var(--orange); }
  .badge-gray { background: var(--bg3); color: var(--text2); }
  .badges { display: flex; gap: 6px; align-items: center; }
  
  /* Meeting Detail */
  .detail-view { display: none; }
  .detail-view.active { display: block; }
  .back-btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; margin-bottom: 16px;
    font-size: 0.85em;
  }
  .back-btn:hover { border-color: var(--accent); }
  
  .detail-header { margin-bottom: 20px; }
  .detail-header h2 { font-size: 1.2em; margin-bottom: 8px; }
  
  /* Audio Player */
  .audio-section {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .audio-section audio { width: 100%; }
  .section-title { font-size: 0.9em; font-weight: 600; margin-bottom: 10px; color: var(--accent); }
  
  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent;
    color: var(--text2); font-size: 0.9em; transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* Summary */
  .summary-content {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; line-height: 1.7; white-space: pre-wrap; font-size: 0.9em;
  }
  .summary-content h1, .summary-content h2, .summary-content h3 {
    color: var(--accent); margin: 16px 0 8px; font-size: 1.1em;
  }
  .summary-content strong { color: var(--accent); }
  .summary-content ul { padding-left: 20px; }
  .summary-content li { margin: 4px 0; }
  
  /* Attendees */
  .attendee-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .attendee {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 14px; font-size: 0.85em; display: flex; align-items: center; gap: 6px;
  }
  .attendee-name { font-weight: 500; }
  .attendee-time { color: var(--text2); font-size: 0.8em; }
  
  /* Transcript */
  .transcript-content {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; max-height: 500px; overflow-y: auto; font-size: 0.85em;
    line-height: 1.8; white-space: pre-wrap;
  }
  
  /* Q&A */
  .qa-section { margin-top: 16px; }
  .qa-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .qa-input {
    flex: 1; background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 6px; font-size: 0.9em;
  }
  .qa-input:focus { outline: none; border-color: var(--accent); }
  .qa-btn {
    background: var(--accent); color: #000; border: none; padding: 10px 20px;
    border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9em;
  }
  .qa-btn:hover { opacity: 0.9; }
  .qa-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .qa-history { display: flex; flex-direction: column; gap: 12px; }
  .qa-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .qa-question { color: var(--accent); font-weight: 500; margin-bottom: 8px; }
  .qa-answer { line-height: 1.6; font-size: 0.9em; white-space: pre-wrap; }
  .qa-loading { color: var(--text2); font-style: italic; }
  
  /* Stats bar */
  .stats { display: flex; gap: 20px; margin-bottom: 20px; }
  .stat { text-align: center; }
  .stat-value { font-size: 1.5em; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.75em; color: var(--text2); }
  
  /* Filter */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .filter-bar select, .filter-bar input {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 4px; font-size: 0.85em;
  }
  
  .no-data { color: var(--text2); font-style: italic; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <!-- List View -->
  <div id="listView">
    <h1>📋 Meeting Review</h1>
    <p class="subtitle">Browse meetings, play audio, read summaries, and ask questions</p>
    
    <div class="stats" id="stats"></div>
    
    <div class="filter-bar">
      <select id="filterSelect" onchange="renderList()">
        <option value="all">All Meetings</option>
        <option value="summarized">Summarized</option>
        <option value="transcribed">Transcribed Only</option>
        <option value="pending">Pending</option>
      </select>
      <select id="sortSelect" onchange="renderList()">
        <option value="date" selected>Newest First</option>
        <option value="duration">Longest First</option>
        <option value="speakers">Most Speakers</option>
        <option value="size">Largest File</option>
        <option value="date">Newest First</option>
        <option value="dateOld">Oldest First</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search filename..." oninput="renderList()">
    </div>
    
    <div class="meeting-list" id="meetingList"></div>
  </div>
  
  <!-- Detail View -->
  <div id="detailView" class="detail-view">
    <button class="back-btn" onclick="showList()">← Back to meetings</button>
    
    <div class="detail-header" id="detailHeader"></div>
    
    <div class="audio-section">
      <div class="section-title">🔊 Audio Playback</div>
      <audio id="audioPlayer" controls preload="none"></audio>
    </div>
    
    <div class="attendee-list" id="attendeeList" style="margin-bottom:16px"></div>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('summary')">Summary</div>
      <div class="tab" onclick="switchTab('transcript')">Transcript</div>
      <div class="tab" onclick="switchTab('qa')">Ask Questions</div>
    </div>
    
    <div id="tab-summary" class="tab-content active"></div>
    <div id="tab-transcript" class="tab-content"></div>
    <div id="tab-qa" class="tab-content">
      <div class="qa-section">
        <div class="qa-input-row">
          <input type="text" class="qa-input" id="qaInput" placeholder="Ask a question about this meeting..." 
            onkeydown="if(event.key==='Enter')askQuestion()">
          <button class="qa-btn" id="qaBtn" onclick="askQuestion()">Ask</button>
        </div>
        <div class="qa-history" id="qaHistory"></div>
      </div>
    </div>
  </div>
</div>

<script>
let meetings = [];
let currentMeeting = null;

async function init() {
  const resp = await fetch('/api/meetings');
  const data = await resp.json();
  meetings = data.meetings;
  
  const summarized = meetings.filter(m => m.has_summary).length;
  const transcribed = meetings.filter(m => m.has_transcript).length;
  
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${data.total}</div><div class="stat-label">Meetings</div></div>
    <div class="stat"><div class="stat-value">${transcribed}</div><div class="stat-label">Transcribed</div></div>
    <div class="stat"><div class="stat-value">${summarized}</div><div class="stat-label">Summarized</div></div>
  `;
  
  renderList();
}

function formatDuration(seconds) {
  if (!seconds) return '0s';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function renderList() {
  const filter = document.getElementById('filterSelect').value;
  const sort = document.getElementById('sortSelect').value;
  const search = document.getElementById('searchInput').value.toLowerCase();
  
  let filtered = [...meetings];
  if (filter === 'summarized') filtered = filtered.filter(m => m.has_summary);
  else if (filter === 'transcribed') filtered = filtered.filter(m => m.has_transcript && !m.has_summary);
  else if (filter === 'pending') filtered = filtered.filter(m => !m.has_transcript);
  
  if (search) filtered = filtered.filter(m => m.file.toLowerCase().includes(search));
  
  if (sort === 'speakers') filtered.sort((a, b) => b.num_speakers - a.num_speakers);
  else if (sort === 'size') filtered.sort((a, b) => b.audio_size_mb - a.audio_size_mb);
  else if (sort === 'date') filtered.sort((a, b) => (b.meeting_datetime || '').localeCompare(a.meeting_datetime || ''));
  else if (sort === 'dateOld') filtered.sort((a, b) => (a.meeting_datetime || '').localeCompare(b.meeting_datetime || ''));
  else filtered.sort((a, b) => b.audio_duration - a.audio_duration);
  
  document.getElementById('meetingList').innerHTML = filtered.map(m => `
    <div class="meeting-card" onclick="openMeeting('${m.id}')">
      <div class="meeting-info">
        <div class="meeting-file">${m.meeting_date ? '📅 ' + m.meeting_date + ' ' + (m.meeting_time || '') + ' — ' : ''}${m.file.replace('-MergedAudio.m4a', '').substring(0,12)}</div>
        <div class="meeting-meta">
          <span>⏱ ${formatDuration(m.audio_duration)}</span>
          <span>👥 ${m.num_speakers} speakers</span>
          <span>💾 ${m.audio_size_mb}MB</span>
        </div>
      </div>
      <div class="badges">
        ${m.has_summary ? '<span class="badge badge-green">Summarized</span>' :
          m.has_transcript ? '<span class="badge badge-orange">Transcribed</span>' :
          '<span class="badge badge-gray">Pending</span>'}
      </div>
    </div>
  `).join('');
}

async function openMeeting(id) {
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').classList.add('active');
  
  const resp = await fetch(`/api/meetings/${id}`);
  currentMeeting = await resp.json();
  
  document.getElementById('detailHeader').innerHTML = `
    <h2>${currentMeeting.file.replace('-MergedAudio.m4a', '')}</h2>
    <div class="meeting-meta">
      ${currentMeeting.meeting_date ? '<span>📅 ' + currentMeeting.meeting_date + ' ' + (currentMeeting.meeting_time || '') + '</span>' : ''}
      <span>⏱ ${formatDuration(currentMeeting.audio_duration)}</span>
      <span>👥 ${currentMeeting.num_speakers} speakers</span>
    </div>
  `;
  
  // Audio
  const audio = document.getElementById('audioPlayer');
  if (currentMeeting.has_audio) {
    audio.src = `/api/meetings/${id}/audio`;
  }
  
  // Attendees
  document.getElementById('attendeeList').innerHTML = currentMeeting.attendees.map(a => `
    <div class="attendee">
      <span class="attendee-name">${a.name}</span>
      <span class="attendee-time">${formatDuration(a.talk_time)}</span>
    </div>
  `).join('') || '<div class="no-data">No attendee data yet</div>';
  
  // Summary
  document.getElementById('tab-summary').innerHTML = currentMeeting.summary
    ? `<div class="summary-content">${formatMarkdown(currentMeeting.summary)}</div>`
    : '<div class="no-data">No summary available yet — processing may still be running</div>';
  
  // Transcript
  document.getElementById('tab-transcript').innerHTML = currentMeeting.transcript
    ? `<div class="transcript-content">${escapeHtml(currentMeeting.transcript)}</div>`
    : '<div class="no-data">No transcript available yet</div>';
  
  // Clear Q&A
  document.getElementById('qaHistory').innerHTML = '';
  document.getElementById('qaInput').value = '';
  
  switchTab('summary');
}

function showList() {
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('audioPlayer').pause();
  currentMeeting = null;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-content#tab-${name}`).classList.add('active');
  event.target.classList.add('active');
}

async function askQuestion() {
  const input = document.getElementById('qaInput');
  const btn = document.getElementById('qaBtn');
  const question = input.value.trim();
  if (!question || !currentMeeting) return;
  
  input.value = '';
  btn.disabled = true;
  
  const history = document.getElementById('qaHistory');
  const item = document.createElement('div');
  item.className = 'qa-item';
  item.innerHTML = `<div class="qa-question">Q: ${escapeHtml(question)}</div><div class="qa-answer qa-loading">Thinking...</div>`;
  history.prepend(item);
  
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, meeting_id: currentMeeting.id})
    });
    const data = await resp.json();
    item.querySelector('.qa-answer').classList.remove('qa-loading');
    item.querySelector('.qa-answer').textContent = data.answer || data.detail || 'No answer';
  } catch (e) {
    item.querySelector('.qa-answer').classList.remove('qa-loading');
    item.querySelector('.qa-answer').textContent = 'Error: ' + e.message;
  }
  
  btn.disabled = false;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMarkdown(md) {
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
}

init();
</script>
</body>
</html>
