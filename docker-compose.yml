services:
  # Web UI (React + Nginx)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: speaker-diarization-ui
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # Speaker Diarization API
  api:
    platform: linux/amd64  # Force x86_64 for PyTorch/CUDA compatibility
    build:
      context: ./api
      dockerfile: Dockerfile
      target: default  # Use 'cpu-base' for CPU-only build
    container_name: speaker-diarization-api
    ports:
      - "8008:8000"
    environment:
      # Hugging Face token (required for first model download)
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      
      # Model settings
      - DIARIZATION_MODEL=pyannote/speaker-diarization-community-1
      - EMBEDDING_MODEL=pyannote/wespeaker-voxceleb-resnet34-LM
      - MODEL_CACHE_DIR=/app/models
      
      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=work_speaker_embeddings

      # Processing settings
      - DEVICE=auto  # auto, cuda, or cpu
      - SIMILARITY_THRESHOLD=0.7

      # VRAM mitigations for pyannote-audio#1963 (multi-GB transient spike in
      # the embedding stage on long files)
      - EMBEDDING_BATCH_SIZE=16
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

      # Disable pyannote 4.x usage telemetry (OTLP to otel.pyannote.ai)
      - PYANNOTE_METRICS_ENABLED=false

      # Whisper STT: speaches container running on this host
      - WHISPER_API_URL=http://host.docker.internal:8000/v1
      - WHISPER_TIMEOUT=1800  # multi-hour meetings exceed the 300s default

      # API settings
      - UPLOAD_DIR=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist downloaded models
      - ./data/models:/app/models
      # Temporary uploads
      - ./data/uploads:/app/uploads
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: speaker-diarization-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  models:
  uploads:
  qdrant:

networks:
  default:
    name: speaker-diarization-network
