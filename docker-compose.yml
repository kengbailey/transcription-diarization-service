services:
  # Web UI (React + Nginx)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: speaker-diarization-ui
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # Speaker Diarization API
  api:
    platform: linux/amd64  # Force x86_64 for PyTorch/CUDA compatibility
    build:
      context: ./api
      dockerfile: Dockerfile
      target: default  # Use 'cpu-base' for CPU-only build
    container_name: speaker-diarization-api
    ports:
      - "8008:8000"
    environment:
      # Hugging Face token (required for first model download)
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      
      # Model settings
      - DIARIZATION_MODEL=pyannote/speaker-diarization-community-1
      # Speaker-ID embedding: wespeaker ResNet221-LM (ONNX, Apache-2.0),
      # ~30% lower verification EER than the ResNet34 the diarization
      # pipeline uses internally. Same 256 dims, DIFFERENT space — vectors
      # from the two models must never share a Qdrant collection.
      - EMBEDDING_MODEL=/app/models/wespeaker-resnet221/voxceleb_resnet221_LM.onnx
      - MODEL_CACHE_DIR=/app/models
      
      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Fresh collection for the ResNet221 embedding space (old ResNet34
      # collections speaker_embeddings / work_speaker_embeddings remain on
      # disk, unused)
      - COLLECTION_NAME=speakers_resnet221

      # Processing settings
      - DEVICE=auto  # auto, cuda, or cpu
      # Calibrated for ResNet221 against the enrolled roster (2026-08-03):
      # worst cross-speaker score 0.583, genuine meeting matches 0.72-0.93
      - SIMILARITY_THRESHOLD=0.65

      # VRAM mitigations for pyannote-audio#1963 (multi-GB transient spike in
      # the embedding stage on long files)
      - EMBEDDING_BATCH_SIZE=16
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

      # Disable pyannote 4.x usage telemetry (OTLP to otel.pyannote.ai)
      - PYANNOTE_METRICS_ENABLED=false

      # ASR: parakeet.cpp service below (~360x real-time on the 3090, native
      # word timestamps). WAV-only, so the api transcodes before upload.
      - WHISPER_API_URL=http://parakeet:8080/v1
      - WHISPER_MODEL=tdt-0.6b-v3
      - WHISPER_SEND_WAV=true
      - WHISPER_CHUNK_SECONDS=180  # parakeet.cpp attention memory grows ~quadratically; 3-min chunks need ~1.3GB vs ~14GB for 10-min
      - WHISPER_TIMEOUT=1800  # multi-hour meetings exceed the 300s default
      # Whisper alternative (speaches container on the host):
      # - WHISPER_API_URL=http://host.docker.internal:8000/v1
      # - WHISPER_MODEL=Systran/faster-whisper-large-v3
      # - WHISPER_SEND_WAV=false

      # API settings
      - UPLOAD_DIR=/app/uploads
      # Optional shared secret for LAN clients (empty = auth disabled).
      # Set API_KEY in .env; clients send "X-API-Key" or "Authorization: Bearer".
      - API_KEY=${API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist downloaded models
      - ./data/models:/app/models
      # Temporary uploads
      - ./data/uploads:/app/uploads
    depends_on:
      - qdrant
      - parakeet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Parakeet ASR (nvidia/parakeet-tdt-0.6b-v3 via parakeet.cpp).
  # Single-model, one-request-at-a-time — fine, the api serializes GPU work.
  parakeet:
    image: ghcr.io/mudler/parakeet.cpp-server:latest-cuda
    container_name: speaker-diarization-parakeet
    command: ["--model", "tdt-0.6b-v3"]
    ports:
      - "8081:8080"
    volumes:
      # Model cache (~1.4 GB gguf, downloaded on first start if absent)
      - ./data/models/parakeet:/root/.cache/parakeet.cpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: speaker-diarization-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  models:
  uploads:
  qdrant:

networks:
  default:
    name: speaker-diarization-network
